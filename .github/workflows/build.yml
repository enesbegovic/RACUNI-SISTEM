name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Instaliraj NuGet alat
        uses: nuget/setup-nuget@v2

      - name: NuGet restore (test projekat)
        run: nuget restore RACUNI-SISTEM_Testovi\RACUNI-SISTEM_Testovi.vcxproj -PackagesDirectory packages
      
      - name: Instaliraj vcpkg i pakete
              run: |
                git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
                C:\vcpkg\bootstrap-vcpkg.bat
                C:\vcpkg\vcpkg install cpp-httplib:x64-windows
                C:\vcpkg\vcpkg install nlohmann-json:x64-windows
                C:\vcpkg\vcpkg integrate install

      - name: Build solution
        run: msbuild RACUNI-SISTEM.slnx /p:Configuration=Release /p:Platform=x64

      - name: Pokreni testove
        shell: pwsh
        run: |
          $testExe = Get-ChildItem -Recurse -Path . -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "Testovi" } | Select-Object -First 1
          if ($testExe) {
            Write-Host "Pokrecem direktno: $($testExe.FullName)"
            & $testExe.FullName
          } else {
            Write-Error "Nije pronadjen test .exe fajl."
            exit 1
          }
